<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site builder</title>
<style>
:root{--bg:#f1f3f6;--card:#fff;--text:#212121;--muted:#6b6f76;--line:#e0e3e8;--blue:#2874f0;--yel:#ffe500;--red:#d93025;--grn:#188038;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--text:#eceef1;--muted:#9aa0a8;--line:#30343b;--blue:#6ea2ff}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--text:#eceef1;--muted:#9aa0a8;--line:#30343b;--blue:#6ea2ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:1.1rem}header button{background:none;border:1px solid #fff8;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 10px}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}.row .fit{flex:none}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.y{background:var(--yel);color:#212121}.btn.s{background:none;color:var(--blue);border:1px solid var(--line)}.btn.d{background:none;color:var(--red);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:wait}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.imgs div{position:relative;width:84px;height:84px;border:1px solid var(--line);border-radius:6px;background:#fff}
.imgs img{width:100%;height:100%;object-fit:contain}
.imgs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;line-height:1}
.imgs div.main{outline:2px solid var(--blue)}
.msg{padding:10px 12px;border-radius:6px;margin-top:10px;font-size:.9rem}
.msg.e{background:#d9302518;color:var(--red)}.msg.o{background:#18803818;color:var(--grn)}
.list{display:grid;gap:8px}
.it{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px}
.it img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px}
.it div.t{flex:1;min-width:0}.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--muted)}
.hide{display:none}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center}
</style>
</head>
<body>
<header><b>Site builder</b><span id="nm" style="font-size:.85rem;opacity:.9"></span></header>
<main>
  <section class="card">
    <h2>Step 1. Upload your site HTML</h2>
    <div class="drop" id="drop"><p style="margin:0 0 8px"><b>Choose your site file</b> (the .html file) or drop it here</p><input type="file" id="file"></div>
    <div id="um"></div>
  </section>
  <section class="card hide" id="s2">
    <h2>Step 2. Add products from links</h2>
    <div class="row"><input id="url" type="url" placeholder="Paste product link here"><button class="btn fit y" id="fetch">Fetch</button></div>
    <div id="fm"></div>
  </section>
  <section class="card hide" id="ed">
    <h2 id="edt">Review and save</h2>
    <label>Title</label><input id="n">
    <div class="g4">
      <div><label>Sale price (₹)</label><input id="p" type="number"></div>
      <div><label>MRP (₹)</label><input id="m" type="number"></div>
      <div><label>Rating</label><input id="r" type="number" step="0.1" max="5"></div>
      <div><label>Rating count</label><input id="rc" type="number"></div>
      <div><label>Delivery (days)</label><input id="dl" type="number" value="3"></div>
      <div><label>Category</label><select id="c"><option>Mobiles</option><option>Electronics</option><option>Appliances</option><option>Furniture</option><option>Fashion</option><option>Beauty</option><option>Home</option></select></div>
    </div>
    <label>Images (the first one is the main image)</label>
    <div class="imgs" id="imgs"></div>
    <div class="row" style="margin-top:8px"><input id="addimg" placeholder="Add image URL"><button class="btn fit s" id="addbtn">Add</button></div>
    <label>Or upload images from your device</label><input type="file" id="upimg" accept="image/*" multiple>
    <label>Highlights (one per line)</label><textarea id="hl"></textarea>
    <label>Description</label><textarea id="d"></textarea>
    <label>Rating breakdown (one per line, like Camera: 4.7)</label><textarea id="sp"></textarea>
    <label>Specifications (one per line, like Brand: Apple)</label><textarea id="spec"></textarea>
    <label>Review photos (image URLs, one per line)</label><textarea id="rp" style="min-height:70px"></textarea>
    <label>Reviews (one per line: rating | title | review | name | photo URLs separated by space)</label><textarea id="rv" style="min-height:130px"></textarea>
    <p class="row"><button class="btn" id="save">Add to site</button><button class="btn s" id="cancel">Cancel</button></p>
    <div id="sm"></div>
  </section>

  <section class="card hide" id="s3">
    <h2>Step 3. Download your updated site</h2>
    <div class="list" id="list"></div>
    <p><button class="btn" id="dl2" style="width:100%">Download updated HTML</button></p>
    <div id="dm"></div>
  </section>
</main>
